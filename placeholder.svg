  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182548"/><stop offset="1" stop-color="#0B1330"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="12" y="12" width="776" height="476" rx="18" fill="none" stroke="#38E4F0" stroke-opacity=".5" stroke-width="3" stroke-dasharray="18 12"/>
  <g transform="translate(400 200)">
    <rect x="-90" y="-70" width="180" height="140" rx="14" fill="#131F42" stroke="#38E4F0" stroke-width="5"/>
    <circle cx="42" cy="-30" r="16" fill="#FFC163"/>
    <path d="M-80 40 L-30 -12 L10 28 L36 6 L80 44 L80 58 L-80 58 Z" fill="#3CE8A0"/>
    <path d="M-80 48 C-50 40 -30 56 0 48 S50 40 80 48 L80 58 L-80 58 Z" fill="#1E5C94"/>
